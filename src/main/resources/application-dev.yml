spring:
  application:
    name: win-crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wincrm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    open-in-view: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET:a9y5iQqQzM+4YVQK8k8Yk7O2lP4W5uV4vW8l4gFhY8Lw7T3z4eJvL5rQkP2M7hGx}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

eskiz:
  base-url: ${ESKIZ_BASE_URL:https://notify.eskiz.uz/api}
  from: ${ESKIZ_FROM:ABATSTEKLO}
  encryption-secret: ${ESKIZ_ENCRYPTION_SECRET:raNGqRTTkZ6KJ9ydsrzzw2Y2hcKtjjBePayRHdzNEkY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:5173,http://192.168.1.52:5174,https://test.urspi.uz}
