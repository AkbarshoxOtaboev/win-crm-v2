spring:
  application:
    name: win-crm

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database: postgresql
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8081}
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:/var/wincrm/uploads}

eskiz:
  base-url: ${ESKIZ_BASE_URL:https://notify.eskiz.uz/api}
  from: ${ESKIZ_FROM:ABATSTEKLO}
  encryption-secret: ${ESKIZ_ENCRYPTION_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
